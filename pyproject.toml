[project]
name = "common-ai"
version = "0.1.0"
description = "Shared AI resources with multi-tool adapters for Kiro, Claude Code, and Gemini CLI"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.8",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.14",
]
dev = [
    "ruff==0.11.12",
    "pytest==8.3.5",
]

[project.scripts]
common-ai = "common_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
