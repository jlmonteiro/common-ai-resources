[project]
name = "common-ai-resources"
version = "1.1.0"
description = "Shared AI resources with multi-tool adapters for Kiro, Claude Code, and Gemini CLI"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.8",
    "pyyaml==6.0.2",
    "mcp==1.9.3",
    "fastembed==0.6.1",
    "numpy==2.3.0",
    "langchain-text-splitters==0.3.8",
]

[project.optional-dependencies]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.14",
]
dev = [
    "invoke==2.2.0",
    "ruff==0.11.12",
    "pytest==8.3.5",
    "pytest-bdd==8.1.0",
    "pytest-cov==6.2.1",
    "pytest-html==4.1.1",
]

[project.scripts]
common-ai = "common_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_ai", "resources"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
