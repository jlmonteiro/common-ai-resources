site_name: Common AI Resources
site_author: Jorge Monteiro
site_description: Shared AI resources with multi-tool adapters for Kiro, Claude Code, and Gemini CLI.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

repo_url: https://github.com/jlmonteiro/common-ai-resources
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Knowledge Bases:
      - Overview: knowledge-bases/index.md
      - SDD: knowledge-bases/sdd.md
      - Docker: knowledge-bases/docker.md
      - Database: knowledge-bases/database.md
      - Gradle: knowledge-bases/gradle.md
      - Helm: knowledge-bases/helm.md
      - Kubernetes: knowledge-bases/k8s.md
      - Java: knowledge-bases/java.md
      - Git: knowledge-bases/git.md
      - Security: knowledge-bases/security.md
      - Observability: knowledge-bases/observability.md
      - Resilience: knowledge-bases/resilience.md
      - Logging: knowledge-bases/logging.md
      - Testing: knowledge-bases/testing.md
      - API: knowledge-bases/api.md
  - MCP Server: mcp-server.md
  - CLI:
      - Overview: cli/index.md
      - Kiro CLI: cli/kiro.md
      - Claude Code: cli/claude.md
      - Gemini CLI: cli/gemini.md
  - Skills:
      - Overview: skills/index.md
      - Git Workflow:
          - Create Branch: skills/git/create-branch.md
          - Commit: skills/git/commit.md
          - Push: skills/git/push.md
          - Create PR: skills/git/create-pr.md
      - SDD:
          - Create Requirements: skills/sdd/create-requirements.md
          - Create Design: skills/sdd/create-design.md
          - Create Tasks: skills/sdd/create-tasks.md
          - Review Specification: skills/sdd/review-specification.md
          - List Specifications: skills/sdd/list-specifications.md
      - Development:
          - Code Review: skills/development/code-review.md
          - Create API Endpoint: skills/development/create-api-endpoint.md
          - Create Test: skills/development/create-test.md
          - Performance Review: skills/development/performance-review.md
          - Review Skill: skills/development/review-skill.md
      - Infrastructure:
          - Create Dockerfile: skills/infrastructure/create-dockerfile.md
          - Create Helm Chart: skills/infrastructure/create-helm-chart.md
      - Security:
          - Security Audit: skills/security/audit.md
      - Database:
          - Create Migration: skills/database/create-migration.md
      - Debugging:
          - Diagnose: skills/debugging/diagnose.md
      - Release:
          - Update Changelog: skills/release/update-changelog.md
      - Documentation:
          - Review Document: skills/document/review.md
      - Project:
          - Create Project: skills/project/create-project.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jlmonteiro/common-ai-resources

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js
