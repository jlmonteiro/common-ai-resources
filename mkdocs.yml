site_name: Common AI Resources
site_author: Jorge Monteiro
site_description: Shared AI resources with multi-tool adapters for Kiro, Claude Code, and Gemini CLI.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

repo_url: https://github.com/jlmonteiro/common-ai-resources
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Knowledge Bases:
      - Overview: knowledge-bases/index.md
      - SDD: knowledge-bases/sdd.md
      - Docker: knowledge-bases/docker.md
      - Database: knowledge-bases/database.md
      - Gradle: knowledge-bases/gradle.md
      - Helm: knowledge-bases/helm.md
      - Git: knowledge-bases/git.md
  - MCP Server: mcp-server.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jlmonteiro/common-ai-resources

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js
