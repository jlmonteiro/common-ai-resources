site_name: Common AI Resources
site_description: Shared AI resources with multi-tool adapters for Kiro, Claude Code, and Gemini CLI.

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/jlmonteiro/common-ai-resources

docs_dir: docs

nav:
  - Home: index.md
  - Knowledge Bases:
      - Overview: knowledge-bases/index.md
      - SDD: knowledge-bases/sdd.md
  - MCP Server: mcp-server.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js
